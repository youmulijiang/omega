name: Release OMEGA Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'OMEGA tag to release (for example v0.1.0)'
        required: true
        type: string
      source_ref:
        description: 'Source ref to build; defaults to the tag and is intended only for release recovery'
        required: false
        type: string

permissions: {}

concurrency:
  group: omega-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      SOURCE_REF: ${{ inputs.source_ref || inputs.tag || github.ref_name }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Validate OMEGA version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[1-9][0-9]*)?$ ]]; then
            echo "::error::Release tag must match vX.Y.Z or vX.Y.Z-beta.N: $RELEASE_TAG"
            exit 1
          fi

          expected_version="${RELEASE_TAG#v}"
          package_version="$(node -p "require('./packages/omega-core/package.json').version")"
          if [[ "$package_version" != "$expected_version" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match @omega/core version $package_version"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep zip unzip openssh-server
          sudo ln -s "$(command -v fdfind)" /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Hydrate release model data
        run: npm run hydrate:model-data

      - name: Check
        run: npm run check

      - name: Build with bundled model data
        run: npm run build:offline

      - name: Build environment daemon
        run: npm --prefix packages/env run build:daemon

      - name: Test
        run: ./test.sh

      - name: Build OMEGA binaries
        run: |
          bash ./scripts/build-all.sh \
            --skip-install \
            --skip-build \
            --offline-model-data \
            --out "${GITHUB_WORKSPACE}/packages/coding-agent/binaries"

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets
          binary_assets=(
            omega-darwin-arm64.tar.gz
            omega-darwin-x64.tar.gz
            omega-linux-arm64.tar.gz
            omega-linux-x64.tar.gz
            omega-windows-arm64.zip
            omega-windows-x64.zip
          )

          for asset in "${binary_assets[@]}"; do
            source="packages/coding-agent/binaries/$asset"
            test -f "$source"
            cp "$source" release-assets/
          done

          cd release-assets
          sha256sum "${binary_assets[@]}" > SHA256SUMS

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: omega-release-${{ env.RELEASE_TAG }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
            archive: omega-darwin-arm64.tar.gz
          - platform: darwin-x64
            runner: macos-15-intel
            archive: omega-darwin-x64.tar.gz
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            archive: omega-linux-arm64.tar.gz
          - platform: linux-x64
            runner: ubuntu-24.04
            archive: omega-linux-x64.tar.gz
          - platform: windows-arm64
            runner: windows-11-arm
            archive: omega-windows-arm64.zip
          - platform: windows-x64
            runner: windows-2025
            archive: omega-windows-x64.zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    env:
      EXPECTED_VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: omega-release-${{ env.EXPECTED_VERSION }}
          path: release-assets

      - name: Smoke test Unix binary
        if: runner.os != 'Windows'
        shell: bash
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail

          mkdir smoke
          tar -xzf "release-assets/$ARCHIVE" -C smoke
          binary="smoke/omega/omega"
          test -x "$binary"
          test "$("$binary" --version)" = "${EXPECTED_VERSION#v}"
          PI_OFFLINE=1 "$binary" --help >/dev/null
          PI_OFFLINE=1 "$binary" --list-models >/dev/null

      - name: Smoke test Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive -LiteralPath "release-assets/$env:ARCHIVE" -DestinationPath smoke
          $binary = Join-Path $PWD 'smoke/omega.exe'
          if (-not (Test-Path -LiteralPath $binary)) {
            throw "Missing OMEGA binary: $binary"
          }
          $expectedVersion = $env:EXPECTED_VERSION.TrimStart('v')
          $actualVersion = & $binary --version
          if ($actualVersion.Trim() -ne $expectedVersion) {
            throw "Expected OMEGA $expectedVersion, got $actualVersion"
          }
          $env:PI_OFFLINE = '1'
          & $binary --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'omega --help failed' }
          & $binary --list-models | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'omega --list-models failed' }

  publish:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: omega-release-${{ env.RELEASE_TAG }}
          path: release-assets

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum -c SHA256SUMS

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::GitHub Release $RELEASE_TAG already exists; refusing to overwrite it"
            exit 1
          fi

          release_flags=()
          if [[ "$RELEASE_TAG" == *-beta.* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi

          gh release create "$RELEASE_TAG" \
            "${release_flags[@]}" \
            --verify-tag \
            --title "OMEGA $RELEASE_TAG" \
            --generate-notes \
            release-assets/omega-*.tar.gz \
            release-assets/omega-*.zip \
            release-assets/SHA256SUMS
