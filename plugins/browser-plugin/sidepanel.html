<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8" />
	<title>Omega</title>
	<style>
		:root {
			color-scheme: light;
			--border: #ececec;
			--text: #1a1a1a;
			--muted: #8f8f8f;
			--green: #1a7f37;
			--gray-bg: #f4f4f4;
			--amber: #f59e0b;
			--amber-bg: #fffbeb;
		}
		* { box-sizing: border-box; }
		body {
			font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
			margin: 0;
			height: 100vh;
			display: flex;
			flex-direction: column;
			color: var(--text);
			background: #fff;
		}
		header {
			position: relative;
			display: grid;
			grid-template-columns: 40px 1fr 40px;
			align-items: center;
			padding: 10px 8px;
			border-bottom: 1px solid var(--border);
		}
		header img {
			width: 24px;
			height: 24px;
			border-radius: 7px;
			background: #000;
			margin-left: 10px;
		}
		header h1 {
			font-size: 15px;
			font-weight: 700;
			margin: 0;
			text-align: center;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 6px;
		}
		header h1 small { font-size: 11px; font-weight: 500; color: var(--muted); }
		header h1 small.connected { color: var(--green); }
		#menuBtn {
			border: none;
			background: none;
			font-size: 18px;
			color: var(--muted);
			cursor: pointer;
			border-radius: 8px;
			padding: 4px 8px;
			justify-self: end;
			margin-right: 8px;
		}
		#menuBtn:hover { background: var(--gray-bg); }
		#sessionBar {
			display: none;
			gap: 8px;
			padding: 8px 12px;
			border-bottom: 1px solid var(--border);
			background: #fafafa;
		}
		#sessionBar.open { display: flex; }
		#sessionBar select {
			flex: 1;
			min-width: 0;
			font-size: 12px;
			padding: 5px 6px;
			border: 1px solid var(--border);
			border-radius: 8px;
			background: #fff;
			color: var(--text);
		}
		#newSession {
			font-size: 12px;
			padding: 5px 8px;
			border: 1px solid var(--border);
			border-radius: 8px;
			background: #fff;
			cursor: pointer;
			white-space: nowrap;
		}
		#newSession:hover { background: var(--gray-bg); }
		#messages { flex: 1; overflow-y: auto; padding: 18px 14px; display: flex; flex-direction: column; gap: 10px; }
		#emptyState {
			flex: 1;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 12px;
			color: var(--muted);
			font-size: 13px;
		}
		#emptyState img {
			width: 64px;
			height: 64px;
			border-radius: 18px;
			filter: grayscale(1);
			opacity: 0.28;
		}
		.msg { max-width: 88%; padding: 10px 12px; border-radius: 16px; font-size: 14px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
		.msg.user { align-self: flex-end; background: var(--gray-bg); border-bottom-right-radius: 6px; }
		.msg.assistant { align-self: flex-start; background: #fff; border: 1px solid var(--border); border-bottom-left-radius: 6px; }
		.msg.broadcast { align-self: flex-start; border-left: 3px solid var(--amber); background: var(--amber-bg); font-size: 13px; }
		.msg.pending { color: var(--muted); font-style: italic; }
		.msg.system { align-self: center; background: none; color: var(--muted); font-size: 12px; padding: 2px; }
		#commandHint {
			display: none;
			margin: 0 12px 6px;
			border: 1px solid var(--border);
			border-radius: 16px;
			background: #fff;
			box-shadow: 0 8px 24px rgba(0, 0, 0, 0.10);
			overflow-y: auto;
			max-height: 260px;
		}
		#commandHint::-webkit-scrollbar { width: 6px; }
		#commandHint::-webkit-scrollbar-thumb { background: #d9d9d9; border-radius: 3px; }
		#commandHint .hint {
			padding: 8px 14px;
			font-size: 13px;
			cursor: pointer;
			display: flex;
			gap: 9px;
			align-items: baseline;
		}
		#commandHint .hint:last-child { border-radius: 0 0 16px 16px; }
		#commandHint .hint:hover { background: var(--gray-bg); }
		#commandHint .hint-icon { flex-shrink: 0; color: var(--muted); display: flex; align-items: center; }
		#commandHint .hint code { font-weight: 600; font-family: inherit; white-space: nowrap; color: var(--text); }
		#commandHint .hint span { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
		#composer {
			margin: 10px 12px 12px;
			border: 1px solid var(--border);
			border-radius: 22px;
			box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
			padding: 10px 12px 8px;
			background: #fff;
		}
		#input {
			width: 100%;
			font-family: inherit;
			font-size: 14px;
			padding: 2px 4px;
			border: none;
			outline: none;
			resize: none;
			height: 22px;
			line-height: 18px;
			background: transparent;
			color: var(--text);
		}
		#composerRow {
			display: flex;
			align-items: center;
			gap: 6px;
			margin-top: 6px;
		}
		#broadcastBtn {
			border: 1px solid transparent;
			background: none;
			cursor: pointer;
			border-radius: 8px;
			padding: 3px 6px;
			color: var(--muted);
			display: flex;
			align-items: center;
		}
		#broadcastBtn:hover { background: var(--gray-bg); color: var(--text); }
		#broadcastBtn.active { background: var(--amber-bg); border-color: var(--amber); color: var(--amber); }
		#modelTag { flex: 1; text-align: right; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
		#send {
			width: 30px;
			height: 30px;
			border: none;
			border-radius: 50%;
			background: #1a1a1a;
			color: #fff;
			font-size: 15px;
			cursor: pointer;
			flex-shrink: 0;
		}
		#send:disabled { background: #d9d9d9; cursor: default; }
	</style>
</head>
<body>
	<header>
		<img src="icon.png" alt="" />
		<h1>Omega <small id="headerTag"></small></h1>
		<button id="menuBtn" title="会话与智能体">⋯</button>
	</header>
	<div id="sessionBar">
		<select id="agentSelect" title="选择要对话的 Omega 智能体"></select>
		<select id="sessionSelect" title="切换 Omega 会话"></select>
		<button id="newSession" title="新建会话">＋</button>
	</div>
	<div id="messages"></div>
	<div id="emptyState">
		<img src="icon.png" alt="" />
		<div>开始与 Omega 对话</div>
		<div>输入 / 查看可用命令</div>
	</div>
	<div id="commandHint"></div>
	<div id="composer">
		<textarea id="input" placeholder="询问任何事，/ 使用命令"></textarea>
		<div id="composerRow">
			<button id="broadcastBtn" title="广播模式：注入信息给智能体，不打断当前任务">
				<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 13v-2z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>
			</button>
			<span id="modelTag"></span>
			<button id="send" title="发送">↑</button>
		</div>
	</div>
	<script src="sidepanel.js"></script>
</body>
</html>
